name: Sync Google Sheets

on:
  schedule:
    - cron: '*/30 * * * *'   # Chạy mỗi 30 phút
  workflow_dispatch:           # Cho phép trigger thủ công từ GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci || npm install

      - name: Sync sheets to JSON
        env:
          APPSCRIPT_URL: ${{ secrets.APPSCRIPT_URL }}
          SHEET_NAMES: ${{ vars.SHEET_NAMES }}
        run: node scripts/sync.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: sync sheets [skip ci]"
          git push
